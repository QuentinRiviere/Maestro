# Maestro controller on a Mac: UI and API locally, generations on the remote
# GPU worker (Settings → Remote GPU).
#
#   docker compose -f docker/controller/compose.yaml pull
#   docker compose -f docker/controller/compose.yaml up -d
#   open http://localhost:7860
#
# To build from this checkout instead of pulling the published image:
#   docker compose -f docker/controller/compose.yaml \
#     -f docker/controller/compose.build.yaml up -d --build
services:
  maestro:
    image: ghcr.io/quentinriviere/maestro-controller:${MAESTRO_TAG:-latest}
    # decord has no linux/arm64 build; Rosetta runs the amd64 image.
    platform: linux/amd64
    ports:
      - "127.0.0.1:${MAESTRO_PORT:-7860}:7860"
    volumes:
      - ${MAESTRO_DATA_DIR:-./data}:/data
      # Lets "Import ~/.dstack" work; localhost URLs in it are rewritten
      # to host.docker.internal inside the container.
      - ${HOME}/.dstack:/root/.dstack:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
