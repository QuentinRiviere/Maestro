# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Hand-written part of llama-swap's config (standalone stack, no Maestro).
# The model hub copies this example to config/llama-swap.base.yaml on its
# first start; edit that copy (git ignores it, so `git pull` never conflicts).
# The model hub renders config/llama-swap.yaml = this file + the `serve:`
# sections of config/models.yml. Edit this file for global settings, groups,
# hooks, peers and hand-written models; the hub never changes it. After an
# edit, re-render (hub UI: "llama-swap config" tab, or
# `docker compose run --rm fetch render`). Paths are inside the containers:
# /models = $MODELS_DIR (read-only for llama-swap).

# Seconds a model may take to become ready (first load from disk), and the
# graceful stop timeout of a swap.
healthCheckTimeout: 600

# Graceful timeout of manual (API/UI) and TTL unloads.
unloadTimeout: 30

# llama-server ports handed out through ${PORT} (container loopback only).
startPort: 10001

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

macros:
  # Managed models are rendered as: ${llama-server} --model ${models}/<owner>/<repo>/<file> ...
  "llama-server": >
    /usr/local/bin/llama-server
    --host 127.0.0.1 --port ${PORT}
    --n-gpu-layers 999 --flash-attn on --jinja
  "models": "/models"

# Hand-written models go here; managed ones are added by the hub.
models: {}

routing:
  router:
    use: group
    settings:
      groups:
        # Always loaded, never unloaded by another group. Keep its total
        # under ~30 GB so a large on-demand model still fits (128 GB unified).
        "resident":
          persistent: true
          swap: false
          exclusive: false
          members: []
        # One at a time; loading one leaves the resident group alone.
        "on-demand":
          swap: true
          exclusive: false
          members: []

# Managed models with `preload: true` are appended here.
hooks:
  on_startup:
    preload: []
