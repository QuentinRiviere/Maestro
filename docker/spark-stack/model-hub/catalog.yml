# Hand-curated GGUF models for the DGX Spark (128 GB unified memory).
#
# Every entry was checked through the Hub API on 2026-10-16
# (GET /api/models/<repo>/revision/<revision>?blobs=true): the repo exists,
# `revision` is the commit the API returned, `include` matches the listed
# files, and `size_gb` is the sum of their sizes. tests/test_spark_model_hub.py
# re-checks this online (skipped offline).
#
# Fields:
#   name, repo, revision (40-hex commit), category (general | abliterated |
#   vision | code | small), include (fnmatch globs, case-sensitive), size_gb,
#   notes, serve (default llama-swap settings; see models.yml for the keys;
#   `group` defaults to MODEL_HUB_DEFAULT_GROUP).
# Only trusted publishers: ggml-org (llama.cpp), unsloth, Qwen, huihui-ai.

- name: Qwen3.6 35B-A3B abliterated (MTP, vision)
  repo: huihui-ai/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF
  revision: acd5abe0c5ebd064f3863ca7d4bba2d924ec6544
  category: abliterated
  include:
    - Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q4_K.gguf   # 21.71 GB
    - mmproj-model-f16.gguf                                    # 0.90 GB
  size_gb: 22.61
  notes: >-
    MoE 35B / 3B active with MTP heads (the model card runs
    --spec-type draft-mtp --spec-draft-n-max 6). Refusal behaviour removed:
    no safety filtering. Good always-on model (fast, ~23 GB).
  serve:
    id: qwen36-35b-abliterated
    name: Qwen3.6 35B-A3B abliterated (MTP)
    model: Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q4_K.gguf
    mmproj: mmproj-model-f16.gguf
    ctx_size: 65536
    parallel: 1
    mtp: true
    mtp_draft_n_max: 6
    ttl: 0
    group: resident
    preload: true

