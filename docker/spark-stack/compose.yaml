# DGX Spark inference stack: llama-swap (with its bundled llama-server) and a
# permanent Maestro worker. See docs/Remote-worker-static-and-llama-swap.md.
#
# UNTESTED on Spark hardware. Fill .env next to this file first:
#
#   SPARK_BIND_ADDR=100.x.y.z        # host address llama-swap is published on (Tailscale)
#   LLAMA_SWAP_API_KEY=sk-...        # printf "sk-%s\n" "$(openssl rand -hex 24)"
#   MAESTRO_WORKER_TOKEN=...         # openssl rand -hex 32 (never leaves the stack)
#   MODELS_DIR=/srv/models           # GGUF files for llama-swap
#   MAESTRO_DATA_DIR=/var/lib/maestro-worker
#
#   docker compose -f docker/spark-stack/compose.yaml up -d
#
# Network: both containers sit on the private "inference" bridge network.
# Only llama-swap's port is published, on SPARK_BIND_ADDR (127.0.0.1 when
# unset; never 0.0.0.0 by default). llama-server runs inside the llama-swap
# container on its loopback. The Maestro worker publishes nothing: the
# controller reaches it through llama-swap's /upstream/maestro-api/ peer
# route, which injects MAESTRO_WORKER_TOKEN.
#
# No /var/run/docker.sock mount: llama-swap does not start containers. Other
# containerised services (TTS, ComfyUI...) follow the Maestro pattern: their
# own service here plus an HTTP lease shim as their llama-swap cmd. Mounting
# the Docker socket (to use "docker run" / "docker stop" in cmd / cmdStop) is
# possible but gives llama-swap root on the host: opt in knowingly.
name: spark-stack

services:
  llama-swap:
    # Official multi-arch image; its arm64 variant is built with CUDA 13 for
    # CMAKE_CUDA_ARCHITECTURES 90;100;120;121 (GB10 = sm_121) and ships
    # llama-server and python3 (llama-swap docker/unified/README.md, v265).
    # Pin a dated tag or a digest once tested.
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda13
    ports:
      - "${SPARK_BIND_ADDR:-127.0.0.1}:${LLAMA_SWAP_PORT:-8080}:8080"
    environment:
      LLAMA_SWAP_CONFIG: /etc/llama-swap/llama-swap.yaml
      # Inside the container: must be 0.0.0.0 for the published port to reach it.
      LLAMA_SWAP_LISTEN: 0.0.0.0:8080
      LLAMA_SWAP_WATCH_CONFIG: "false"
      LLAMA_SWAP_API_KEY: ${LLAMA_SWAP_API_KEY:?set LLAMA_SWAP_API_KEY}
      MAESTRO_WORKER_URL: http://maestro-worker:7860
      MAESTRO_WORKER_TOKEN: ${MAESTRO_WORKER_TOKEN:?set MAESTRO_WORKER_TOKEN}
    volumes:
      - ./llama-swap.yaml:/etc/llama-swap/llama-swap.yaml:ro
      - ./maestro_worker_lease.py:/opt/maestro/maestro_worker_lease.py:ro
      - ${MODELS_DIR:-/srv/models}:/models:ro
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Stopping llama-swap stops the lease, which waits for the running render
    # (see healthCheckTimeout in llama-swap.yaml).
    stop_grace_period: 1h
    restart: unless-stopped

  maestro-worker:
    image: ghcr.io/quentinriviere/maestro-worker:spark
    # No ports: reachable only on the inference network (and through llama-swap).
    environment:
      # Inside the container; the network is private and every request needs the token.
      SERVER_NAME: 0.0.0.0
      SERVER_PORT: "7860"
      MAESTRO_WORKER_TOKEN: ${MAESTRO_WORKER_TOKEN:?set MAESTRO_WORKER_TOKEN}
      # Start paused: only llama-swap's lease (maestro-worker, preloaded at
      # llama-swap start) lets jobs load models, so a worker restart never
      # loads one next to big-llm.
      MAESTRO_WORKER_START_PAUSED: "1"
      # Unload the models after 30 idle minutes even while leased (0: never).
      MAESTRO_WORKER_IDLE_UNLOAD_SECONDS: "1800"
      MAESTRO_DATA: /workspace/data
      # Unified memory: pinning only duplicates weights, and moving a model
      # "back to RAM" copies it within the same memory.
      MAESTRO_PINNED_MEMORY: "0"
      MAESTRO_KEEP_MODELS_IN_VRAM: "1"
      MAESTRO_REPO_URL: ${MAESTRO_REPO_URL:-https://github.com/QuentinRiviere/Maestro.git}
      MAESTRO_REPO_REF: ${MAESTRO_REPO_REF:-main}
      # Optional R2 checkpoint cache (same variables as a dstack pod):
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
      # MAESTRO_R2_BUCKET, MAESTRO_R2_PREFIX
    volumes:
      - ${MAESTRO_DATA_DIR:-/var/lib/maestro-worker}:/workspace/data
    networks: [inference]
    # Same boot as a dstack run (worker_spec.build_run_spec): clone the
    # configured branch, then run the worker boot script.
    entrypoint: ["bash", "-c"]
    command:
      - >
        rm -rf /workspace/maestro &&
        git clone --quiet --depth 1 --single-branch --branch "$$MAESTRO_REPO_REF"
        "$$MAESTRO_REPO_URL" /workspace/maestro &&
        exec bash /workspace/maestro/app/scripts/remote_worker_boot.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # docker stop kills a running render after this grace period: release the
    # worker first (see the doc's Operations section) before stopping it.
    stop_grace_period: 2m
    restart: unless-stopped

networks:
  # Private bridge (not "internal": the worker needs outbound access to clone
  # the repository and download weights). Nothing on it is published except
  # llama-swap's port above.
  inference: {}
