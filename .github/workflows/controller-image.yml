name: Controller image

# Builds the Maestro controller image (docker/controller/Dockerfile): UI + API
# without a local GPU, for a Mac that sends generations to the remote worker.
# Multi-arch on native runners: arm64 runs without Rosetta on Apple Silicon
# (about 10 s to start instead of 70-80 s for amd64 under emulation).
on:
  push:
    branches: [main, feat/comfy-inference-backend]
    paths:
      - app/**
      - ui/**
      - docker/controller/**
      - .dockerignore
      - .github/workflows/controller-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: controller-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/maestro-controller

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force
          df -h /

      - name: Prepare
        id: prep
        run: |
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "arch=${{ matrix.platform }}" | sed 's#linux/##' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/controller/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=controller-${{ steps.prep.outputs.arch }}
          cache-to: type=gha,mode=max,scope=controller-${{ steps.prep.outputs.arch }}
          outputs: type=image,name=${{ steps.prep.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.prep.outputs.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          docker buildx imagetools create \
            -t "${image}:latest" -t "${image}:${branch}" -t "${image}:sha-${sha}" \
            $(printf "${image}@sha256:%s " *)
          docker buildx imagetools inspect "${image}:latest"
