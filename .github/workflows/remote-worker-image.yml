name: Remote worker image

# Builds the dependency image used by the remote GPU worker
# (docker/remote-worker/Dockerfile) and its CPU variant for the R2 cache warmer
# (docker/cache-warmer/Dockerfile, tag `cpu`), and pushes both to GHCR. Code is
# cloned at pod boot, so this only needs to run when the dependency set changes.
on:
  push:
    branches: [main, feat/comfy-inference-backend]
    paths:
      - app/requirements.txt
      - docker/remote-worker/**
      - docker/cache-warmer/**
      - docker/controller/controller_requirements.py
      - .github/workflows/remote-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build compiles SageAttention 2.2 for four GPU archs (~30-45 min
    # on the 4-vCPU hosted runner) before the usual ~10-15 min dependency
    # install. The registry cache below skips that stage when only
    # requirements.txt changes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        # CUDA + torch + Maestro's dependencies exceed the default free space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Prepare build context
        run: cp app/requirements.txt docker/remote-worker/requirements.txt

      - name: Compute tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          deps="$(sha256sum app/requirements.txt docker/remote-worker/Dockerfile | sha256sum | cut -c1-12)"
          echo "image=ghcr.io/${owner}/maestro-worker" >> "$GITHUB_OUTPUT"
          echo "deps=${deps}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/remote-worker
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:deps-${{ steps.meta.outputs.deps }}
          # mode=max keeps the SageAttention builder stage, which is not part
          # of the final image. A cache failure must never fail the build.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max,ignore-error=true

  cpu:
    # The cache warmer's CPU image: same package, `cpu` tag, so it shares the
    # worker image's visibility and pull credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          deps="$(sha256sum app/requirements.txt docker/cache-warmer/Dockerfile docker/controller/controller_requirements.py | sha256sum | cut -c1-12)"
          echo "image=ghcr.io/${owner}/maestro-worker" >> "$GITHUB_OUTPUT"
          echo "deps=${deps}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cache-warmer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:cpu
            ${{ steps.meta.outputs.image }}:cpu-${{ steps.meta.outputs.deps }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-cpu
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-cpu,mode=max,ignore-error=true
